<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Reunión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4" style="max-width: 820px;">

    <h2 class="mb-3">Registrar Reunión</h2>

    <!-- Si no hay salas, avisamos -->
    <div th:if="${#lists.isEmpty(salas)}" class="alert alert-warning">
        ⚠ No hay salas registradas. Primero agrega una sala para poder crear reuniones.
        <div class="mt-2">
            <a class="btn btn-sm btn-primary" th:href="@{/salas/nueva}">Ir a agregar sala</a>
            <a class="btn btn-sm btn-link" th:href="@{/reuniones}">Volver</a>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(salas)}" class="card">
        <div class="card-body">
            <form th:action="@{/reuniones/guardar}" th:object="${reunion}" method="post">

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control" th:field="*{titulo}" required>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fecha}" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Hora</label>
                        <input type="time" class="form-control" th:field="*{hora}" required>
                    </div>
                </div>

                <div class="mt-3 mb-3">
                    <label class="form-label">Sala</label>
                    <select class="form-select" th:field="*{salaId}" required>
                        <option value="" disabled selected>Seleccione una sala</option>
                        <option th:each="s : ${salas}"
                                th:value="${s.id}"
                                th:text="${s.nombre}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-success" type="submit">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/reuniones}">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>
