<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Reuniones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Listado de Reuniones</h2>
        <a class="btn btn-primary" th:href="@{/reuniones/nueva}">+ Registrar Reunión</a>
    </div>

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered m-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Sala</th>
                        <th style="width:180px;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="r : ${reuniones}">
                        <td th:text="${r.id}">1</td>
                        <td th:text="${r.titulo}">Reunión</td>
                        <td th:text="${r.fecha}">2026-02-24</td>
                        <td th:text="${r.hora}">14:30</td>

                        <td>
                            <span th:each="s : ${salas}"
                                  th:if="${s.id} == ${r.salaId}"
                                  th:text="${s.nombre}">
                                Sala
                            </span>
                        </td>

                        <td>
                            <a class="btn btn-sm btn-warning disabled" href="#">Editar</a>

                            <!-- Botón que abre MODAL (NO elimina de una vez) -->
                            <button type="button"
                                    class="btn btn-sm btn-danger btn-open-delete-modal"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalEliminarReunion"
                                    th:attr="data-id=${r.id},data-titulo=${r.titulo}">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(reuniones)}">
                        <td colspan="6" class="text-center text-muted">
                            No hay reuniones registradas.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a class="btn btn-link mt-3" th:href="@{/}">Volver al Home</a>

</div>

<div class="modal fade" id="modalEliminarReunion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Confirmar eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                ¿Seguro que deseas eliminar la reunión:
                <strong id="modalReunionTitulo">---</strong>?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

                <!-- Este link se llenará con el ID real -->
                <a id="btnConfirmarEliminar"
                   class="btn btn-danger"
                   href="#">
                    Eliminar
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const modalTitulo = document.getElementById("modalReunionTitulo");
        const btnConfirmar = document.getElementById("btnConfirmarEliminar");

        document.querySelectorAll(".btn-open-delete-modal").forEach(btn => {
            btn.addEventListener("click", function () {
                const id = this.getAttribute("data-id");
                const titulo = this.getAttribute("data-titulo");

                modalTitulo.textContent = titulo;
                btnConfirmar.href = "/reuniones/eliminar/" + id;
            });
        });
    });
</script>

</body>
</html>
