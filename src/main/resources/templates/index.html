<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Reuniones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">

    <div class="text-center mb-4">
        <h1 class="mb-2">Gestión de Reuniones</h1>
        <p class="text-muted m-0">Administra salas y reuniones</p>
    </div>

    <div class="row g-3 justify-content-center">
        <div class="col-12 col-md-5">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Salas</h5>
                    <p class="card-text text-muted">Crea y consulta salas disponibles.</p>
                    <a class="btn btn-primary w-100" th:href="@{/salas}">Ir a Salas</a>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-5">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Reuniones</h5>
                    <p class="card-text text-muted">Registra reuniones y asígnalas a una sala.</p>
                    <a class="btn btn-outline-primary w-100" th:href="@{/reuniones}">Ir a Reuniones</a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
