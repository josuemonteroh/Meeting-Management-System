<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Salas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Listado de Salas</h2>
        <a class="btn btn-primary" th:href="@{/salas/nueva}">+ Agregar Sala</a>
    </div>

    <!-- Mensaje Flash -->
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered m-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Capacidad</th>
                        <th style="width:160px;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="s : ${salas}">
                        <td th:text="${s.id}">1</td>
                        <td th:text="${s.nombre}">Sala</td>
                        <td th:text="${s.capacidad}">10</td>
                        <td>
                            <a class="btn btn-sm btn-warning disabled" href="#">
                                Editar
                            </a>

                            <a class="btn btn-sm btn-danger"
                               th:href="@{/salas/eliminar/{id}(id=${s.id})}"
                               onclick="return confirm('¿Seguro que desea eliminar esta sala?');">
                                Eliminar
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(salas)}">
                        <td colspan="4" class="text-center text-muted">
                            No hay salas registradas.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a class="btn btn-link mt-3" th:href="@{/}">Volver al Home</a>

</div>
</body>
</html>
