<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Sala</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-4" style="max-width: 720px;">

    <h2 class="mb-3">Agregar Sala</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/salas/guardar}" th:object="${sala}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Capacidad</label>
                    <input type="number" class="form-control" th:field="*{capacidad}" min="1" required>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-success" type="submit">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/salas}">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>
